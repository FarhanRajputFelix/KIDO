name: kido
description: KIDO – AI-Powered Safe Learning Ecosystem for Children
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  provider: ^6.1.2

  # HTTP / API
  dio: ^5.4.3+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.1

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_markdown: ^0.7.3
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
