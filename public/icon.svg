<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="48" y1="40" x2="470" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#3F3D9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="160" y1="150" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E8E6FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <!-- Top-left sheen -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#glow)"/>
  <!-- Subtle bottom vignette -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#1e1b4b" opacity="0.06"/>

  <!-- Main sparkle (AI/learning spark) -->
  <path filter="url(#soft)" fill="url(#spark)"
    d="M256 104
       C272 196 316 240 408 256
       C316 272 272 316 256 408
       C240 316 196 272 104 256
       C196 240 240 196 256 104 Z"/>

  <!-- Small accent sparkle -->
  <path fill="#FFD700"
    d="M372 132
       C377 158 390 171 416 176
       C390 181 377 194 372 220
       C367 194 354 181 328 176
       C354 171 367 158 372 132 Z"/>

  <!-- Tiny dot -->
  <circle cx="150" cy="372" r="14" fill="#FFD700" opacity="0.9"/>
</svg>
